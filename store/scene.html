<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --gold: linear-gradient(180deg, #ffe08a, #ff9b3d); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(120% 90% at 0% 0%, #343a72 0%, #1d1940 55%, #120d26 100%);
    color: #fff; display: flex; align-items: center; gap: 48px; padding: 0 0 0 72px;
  }
  .copy { width: 400px; flex: none; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; font-weight: 600; font-size: 22px; }
  .brand img { width: 52px; height: 52px; }
  h1 { font-size: 46px; line-height: 1.1; margin: 0 0 20px; letter-spacing: -0.02em; }
  h1 em { font-style: normal; background: var(--gold); -webkit-background-clip: text; color: transparent; }
  p { font-size: 20px; line-height: 1.45; margin: 0; color: #c9c7e6; }

  /* A generic browser window, cut off at the right edge. */
  .browser {
    width: 720px; height: 600px; flex: none; border-radius: 12px; overflow: hidden; position: relative;
    background: #fff; box-shadow: 0 30px 80px rgb(0 0 0 / .5); color: #1d1d1f;
  }
  .tabs { height: 40px; background: #dee1e6; display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
  .dots { display: flex; gap: 8px; align-self: center; margin-right: 10px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .tab { background: #fff; border-radius: 8px 8px 0 0; padding: 8px 14px; font-size: 13px; width: 230px; display: flex; gap: 8px; align-items: center; }
  .tab::before { content: "♪"; color: #888; }
  .bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #e3e3e6; }
  .url { flex: 1; height: 30px; border-radius: 15px; background: #f1f3f4; font-size: 13px; color: #5f6368; display: flex; align-items: center; padding: 0 14px; }
  .ext { position: relative; width: 28px; height: 28px; border-radius: 6px; background: #e8eaed; display: grid; place-items: center; }
  .ext img { width: 18px; height: 18px; }
  .badge { position: absolute; right: -6px; bottom: -4px; background: #ff9b3d; color: #fff; font: 600 10px/1 system-ui; padding: 2px 4px; border-radius: 4px; }
  .page { padding: 20px 24px; }
  .video {
    height: 300px; border-radius: 10px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #3b2a5c, #7a3b52 50%, #d07a3a);
  }
  .video::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: linear-gradient(90deg, #fff 38%, rgb(255 255 255 / .3) 38%); }
  .eq { position: absolute; left: 32px; bottom: 30px; display: flex; gap: 6px; align-items: flex-end; }
  .eq i { width: 10px; background: rgb(255 255 255 / .75); border-radius: 3px; }
  .meta h2 { font-size: 18px; margin: 14px 0 4px; } .meta span { color: #6e6e73; font-size: 13px; }
  .lines i { display: block; height: 10px; border-radius: 5px; background: #eee; margin-top: 10px; }

  .popup {
    position: absolute; top: 76px; right: 8px; width: 300px; height: 262px; border: 0;
    border-radius: 10px; box-shadow: 0 12px 40px rgb(0 0 0 / .28), 0 0 0 1px rgb(0 0 0 / .08);
    background: #fff; transform: scale(1.35); transform-origin: top right;
  }
</style>
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="../extension/icons/128.png" alt="">PitchTap</div>
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </section>
  <div class="browser">
    <div class="tabs"><span class="dots"><i></i><i></i><i></i></span><span class="tab" id="tab-title"></span></div>
    <div class="bar"><span class="url">video.example/watch?v=acoustic-session</span><span class="ext"><img src="../extension/icons/32.png" alt=""><span class="badge" id="badge" hidden></span></span></div>
    <div class="page">
      <div class="video"><div class="eq"></div></div>
      <div class="meta"><h2 id="page-title"></h2><span>Live session · 4:12</span></div>
      <div class="lines"><i style="width:90%"></i><i style="width:70%"></i></div>
    </div>
    <iframe class="popup" id="popup"></iframe>
  </div>
<script>
  // One scene per store screenshot: scene.html?shot=1..3
  const TITLE = 'Acoustic Session (Live)';
  const SHOTS = {
    1: { headline: 'Change the key of <em>any song</em> in a Chrome tab.', sub: 'Same tempo. Slide the pitch up or down in semitones, live, while it plays.', enabled: 1, semitones: -2, cents: 0 },
    2: { headline: 'Sing it in <em>your</em> range.', sub: 'Drop a song a few semitones so the chorus fits your voice, or raise it to practise with a capo.', enabled: 1, semitones: 3, cents: 0 },
    3: { headline: 'Fine-tune to <em>the cent</em>.', sub: 'Match a recording that isn’t at concert pitch, or try A = 432 Hz at −32 cents.', enabled: 1, semitones: 0, cents: -32 },
    4: { headline: 'Private <em>by design</em>.', sub: 'The sound is processed on your computer as it plays. Nothing is recorded, saved or sent anywhere. No account, no ads.', enabled: 0, semitones: 0, cents: 0 },
  };
  const s = SHOTS[new URLSearchParams(location.search).get('shot') ?? 1];
  document.getElementById('headline').innerHTML = s.headline;
  document.getElementById('sub').textContent = s.sub;
  document.getElementById('tab-title').textContent = TITLE;
  document.getElementById('page-title').textContent = TITLE;
  const total = s.semitones + s.cents / 100;
  if (s.enabled) Object.assign(document.getElementById('badge'), { hidden: false, textContent: (total >= 0 ? '+' : '') + (Number.isInteger(total) ? total : total.toFixed(1)) });
  const eq = document.querySelector('.eq');
  [40, 70, 55, 90, 62, 34, 76, 48, 66, 28].forEach((h) => { const i = document.createElement('i'); i.style.height = h + 'px'; eq.append(i); });
  document.getElementById('popup').src = `popup-preview.html?enabled=${s.enabled}&semitones=${s.semitones}&cents=${s.cents}&title=${encodeURIComponent(TITLE)}`;
</script>
</body>
</html>
