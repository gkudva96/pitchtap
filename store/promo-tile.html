<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif; color: #fff;
    background: radial-gradient(120% 120% at 0% 0%, #343a72 0%, #1d1940 55%, #120d26 100%);
    display: flex; align-items: center; gap: 22px; padding: 0 32px; box-sizing: border-box;
  }
  img { width: 128px; height: 128px; flex: none; }
  h1 { margin: 0 0 8px; font-size: 38px; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 17px; line-height: 1.35; color: #c9c7e6; }
  b { background: linear-gradient(180deg, #ffe08a, #ff9b3d); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body>
  <img src="../extension/icons/128.png" alt="">
  <div><h1>PitchTap</h1><p>Change the key of any song.<br><b>Same tempo.</b></p></div>
</body>
</html>
